<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Quality Study</title>

<script>
  // 密码保护逻辑
  (function(){
    let tries = 3; // 最大尝试次数
    while(tries > 0){
      let pwd = prompt("请输入访问密码:");
      if(pwd === "123456"){ // 改成你自己的密码
        break; // 正确，允许访问
      }
      tries--;
      alert("密码错误, 还剩 " + tries + " 次机会");
    }
    if(tries === 0){
      alert("已达到最大尝试次数，无法访问此页面。");
      window.location.href = "https://www.google.com"; // 跳转到其他页面
      document.write(""); // 清空页面
    }
  })();
</script>

<style>
body {
  background:#0b0f17;
  color:#fff;
  font-family: Arial, sans-serif;
  margin:24px;
}

h2 {
  text-align:center;
  font-size:34px;
}

p {
  text-align:center;
  color:#d0d6e6;
}

#status {
  text-align:center;
  color:#ff5555;
  font-size:20px;
  font-weight:bold;
}

.controls {
  text-align:center;
  margin:20px 0;
}

button {
  padding:12px 24px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#7aa2ff;
  color:#fff;
  font-weight:bold;
}

button:disabled {
  background:#555;
  cursor:not-allowed;
}

.grid {
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  margin-top:22px;
}

.card {
  background:#121a2a;
  padding:12px;
  border-radius:12px;
}

.card h3 {
  margin-top:0;
  margin-bottom:10px;
}

video {
  width:100%;
  height:220px;
  background:#000;
  border-radius:8px;
}

.rating {
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.rating label {
  cursor:pointer;
}

.rating input:disabled + span {
  color:#777;
}

.submit-area {
  text-align:center;
  margin-top:28px;
}

@media(max-width:1100px){
  .grid {
    grid-template-columns:repeat(2, 1fr);
  }
}

@media(max-width:650px){
  .grid {
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<h2>Video Quality Study</h2>

<p>Please wait until the videos are ready, then click <b>Play All</b> to watch them together.</p>
<p>Please rate each video from 1 to 5 based on your overall viewing experience.</p>
<p>1 = Bad, 2 = Poor, 3 = Fair, 4 = Good, 5 = Excellent.</p>

<div id="status">Loading videos...</div>

<div class="controls">
  <button id="playBtn" disabled onclick="playAll()">Play All</button>
</div>

<div class="grid">

  <!-- 这里的视频卡片保持不变，略 -->

</div>

<div class="submit-area">
  <button id="submitBtn" onclick="submitAll()" disabled>Submit</button>
</div>

<script>
const videos = Array.from(document.querySelectorAll("video"));
const statusText = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const submitBtn = document.getElementById("submitBtn");
const ratingInputs = document.querySelectorAll(".rating input");

let loaded = new Set();
let ended = new Set();
let hasPlayedOnce = false;

ratingInputs.forEach(input => {
  input.disabled = true;
  input.addEventListener("change", checkSubmitReady);
});

videos.forEach((v, idx) => {
  v.addEventListener("loadeddata", () => {
    loaded.add(idx);
    statusText.innerText = `Loading videos... ${loaded.size}/${videos.length}`;

    if (loaded.size === videos.length) {
      statusText.innerText = "Ready to play.";
      statusText.style.color = "#5affdc";
      playBtn.disabled = false;
    }
  });

  v.addEventListener("ended", () => {
    ended.add(idx);

    if (ended.size === videos.length) {
      statusText.innerText = "Playback finished. Please rate all videos. You may replay if needed.";
      statusText.style.color = "#5affdc";

      ratingInputs.forEach(input => {
        input.disabled = false;
      });

      playBtn.disabled = false;
      playBtn.innerText = "Replay All";

      checkSubmitReady();
    }
  });

  v.addEventListener("error", () => {
    statusText.innerText = "Some videos failed to load. Please refresh the page.";
    statusText.style.color = "#ff5555";
    playBtn.disabled = true;
    submitBtn.disabled = true;
    ratingInputs.forEach(input => input.disabled = true);
  });
});

async function playAll(){
  if (!hasPlayedOnce) {
    ended.clear();
    submitBtn.disabled = true;
    ratingInputs.forEach(input => input.disabled = true);
    playBtn.disabled = true;
    playBtn.innerText = "Playing...";
    statusText.innerText = "Playing videos. Please watch until the end.";
    statusText.style.color = "#ffd166";
  } else {
    playBtn.disabled = true;
    playBtn.innerText = "Replaying...";
    statusText.innerText = "Replaying videos. You may revise your ratings if needed.";
    statusText.style.color = "#ffd166";
  }

  videos.forEach(v => {
    try {
      v.pause();
      v.currentTime = 0;
      v.muted = true;
    } catch(e) {}
  });

  await new Promise(resolve => setTimeout(resolve, 300));
  const results = await Promise.allSettled(videos.map(v => v.play()));
  const ok = results.filter(r => r.status === "fulfilled").length;

  if (ok === 0) {
    alert("Playback failed. Please click Play All again.");
    playBtn.disabled = false;
    playBtn.innerText = hasPlayedOnce ? "Replay All" : "Play All";
    statusText.innerText = "Playback failed. Please try again.";
    statusText.style.color = "#ff5555";
    return;
  }

  videos[0].muted = false;
  hasPlayedOnce = true;
}

function getScore(i){
  const r = document.querySelector(`input[name="s${i}"]:checked`);
  return r ? r.value : null;
}

function checkSubmitReady(){
  for(let i = 1; i <= 7; i++){
    if(!getScore(i)){
      submitBtn.disabled = true;
      return;
    }
  }
  submitBtn.disabled = false;
}

function generateCode(){
  const timePart = Date.now().toString().slice(-6);
  const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
  return "mtvideo" + timePart + randomPart;
}

function submitAll(){
  if (ended.size !== videos.length) {
    alert("Please watch all videos until the end before rating.");
    return;
  }

  const scores = [];
  for(let i = 1; i <= 7; i++){
    const s = getScore(i);
    if(!s){
      alert("Please rate all videos before submitting.");
      return;
    }
    scores.push(s);
  }

  const code = generateCode();
  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf4YDJ0sZQEpiDz4M4VXZa9PGACwS4AP4qNn423l_bficFiAw/formResponse";

  const data = new FormData();
  data.append("entry.16441556", scores[0]);
  data.append("entry.2025751820", scores[1]);
  data.append("entry.1793582851", scores[2]);
  data.append("entry.458650404", scores[3]);
  data.append("entry.1719923684", scores[4]);
  data.append("entry.418349952", scores[5]);
  data.append("entry.1934328220", scores[6]);
  data.append("entry.1290720256", code);

  fetch(formUrl, {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  document.body.innerHTML = `
    <div style="max-width:720px;margin:80px auto;text-align:center;font-family:Arial,sans-serif;color:white;">
      <h2>Thank you!</h2>
      <p>Please copy the following completion code and submit it on MTurk.</p>
      <h1 style="font-size:42px;">${code}</h1>
    </div>
  `;
}
</script>

</body>
</html>
